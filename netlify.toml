# ============================================================================
# casium.top — Netlify configuration
# ----------------------------------------------------------------------------
# Connect this repo to Netlify and everything below is picked up automatically:
# the site builds from /website, publishes /website/public and deploys the
# functions in /website/netlify/functions (which serve /api/*).
#
# No build command is needed — the site is static files + serverless functions.
# ============================================================================

[build]
  base      = "website"
  publish   = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------------------
# Environment variables to set in the dashboard
# (Site configuration → Environment variables → add a variable → deploy):
#
#   CASIUM_ADMIN_USER   your console username
#   CASIUM_ADMIN_PASS   your console password
#   CASIUM_SESSION_SECRET   long random string, e.g. output of:
#                           openssl rand -hex 32
#
# You can also set the username/password from inside the console
# (Credentials button) — those are stored hashed and win over the env values.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Headers
# ---------------------------------------------------------------------------

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options    = "nosniff"
    Referrer-Policy           = "strict-origin-when-cross-origin"
    X-Frame-Options           = "DENY"
    Permissions-Policy        = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Content-Security-Policy   = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; media-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

[[headers]]
  for = "/thisismyveryownkeyspage*"
  [headers.values]
    X-Robots-Tag  = "noindex, nofollow, noarchive, nosnippet"
    Referrer-Policy = "no-referrer"
    Cache-Control = "no-store"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
